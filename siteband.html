<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Bandcamp - Musics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->    <header>
        <div class="logo">CLONE CAMP</div>
        <nav>
            <ul>
                <li><a href="#">Descobrir</a></li>
                <li><a href="#">Comunidade</a></li>
                <li><a href="#">Pro</a></li>
            </ul>
        </nav>
        <div class="search-bar">
            <input type="text" placeholder="Buscar artista ou música...">
        </div>
    </header>

    <!-- Banner Destaque -->    <section class="hero">
        <h1>Descubra novas músicas de artistas independentes.</h1>
    </section>

    <!-- Grade de Álbuns -->    <section class="discover">
        <h2>Novos Lançamentos</h2>
        <div class="album-grid">
            
            <!-- Álbum 1 -->            <div class="album-card">
                <img src="images/album1.jpg" alt="Arte do Álbum">
                <div class="album-info">
                    <h3>Echoes of Silence</h3>
                    <p>Artista Indie</p>
                    <span class="price">R$10.00</span>
                </div>
            </div>

            <!-- Repita o album-card para mais itens -->            <div class="album-card">
                <img src="images/album1.jpg" alt="Arte do Álbum">
                <div class="album-info">
                    <h3>Lo-Fi Sessions</h3>
                    <p>Beatmaker</p>
                    <span class="price">R$5.00</span>
                </div>
            </div>
            
            <div class="album-card">
                <img src="images/album1.jpg" alt="Arte do Álbum">
                <div class="album-info">
                    <h3>Rock Alternativo</h3>
                    <p>Banda XYZ</p>
                    <span class="price">R$15.00</span>
                </div>
            </div>
            
        </div>
    </section>

</body>
</html>
